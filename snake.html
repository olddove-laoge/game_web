<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇小游戏 - 改进版</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            padding: 20px;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 90vw;
        }
        
        .game-header {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .game-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            -webkit-background-clip: text;

        }
        
        .score-board {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .score, .high-score {
            text-align: center;
            color: white;
        }
        
        .score h2, .high-score h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        
        .score-value, .high-score-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .game-board {
            position: relative;
            background: #061c25;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        
        canvas {
            display: block;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(to right, #ff8a00, #da1b60);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .instructions {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            color: white;
            max-width: 500px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .instructions h2 {
            margin-bottom: 15px;
            color: #ff8a00;
        }
        
        .instructions p {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .game-over, .game-start {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            border-radius: 10px;
            text-align: center;
            padding: 20px;
            gap: 15px; /* 统一内部元素间距 */
        }
        
        .game-start {
            display: flex;
        }
        
        .game-over {
            display: none;
        }
        
        .direction-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            color: #ff8a00;
        }
        
        .direction-row {
            display: flex;
        }
        
        .direction-key {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            margin: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
        }
        
        .active-key {
            background: linear-gradient(to right, #ff8a00, #da1b60);
            transform: scale(1.05);
        }

        /* ============================================== */
        /* 统一提交成绩区域样式（与颜色误导挑战保持一致） */
        /* ============================================== */
        .score-submit {
            display: flex;
            flex-direction: column;
            gap: 10px; /* 输入框与按钮间距 */
            width: 100%;
            max-width: 350px; /* 限制最大宽度，避免过宽 */
            margin-top: 10px;
        }

        #player-name {
            padding: 12px 15px; /* 统一内边距 */
            border: none;
            border-radius: 50px; /* 圆角设计 */
            font-size: 1rem;
            color: #333; /* 文本颜色 */
            background: white; /* 白色背景，与之前一致 */
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2); /* 轻微阴影 */
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        #player-name:focus {
            box-shadow: 0 0 0 2px rgba(255, 138, 0, 0.5); /* 聚焦时高亮 */
        }

        #submit-score {
            padding: 12px 25px; /* 与其他按钮统一内边距 */
            border: none;
            border-radius: 50px; /* 圆角 */
            background: linear-gradient(to right, #ff8a00, #da1b60); /* 统一渐变色 */
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        #submit-score:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        #submit-score:active {
            transform: translateY(1px);
        }
        /* ============================================== */
        
        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                padding: 10px 20px;
            }
            
            .game-header h1 {
                font-size: 2rem;
            }
            
            .direction-key {
                width: 40px;
                height: 40px;
            }

            /* 小屏幕提交区域适配 */
            .score-submit {
                padding: 0 10px;
            }

            #player-name, #submit-score {
                padding: 10px 15px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h1>🐍 贪吃蛇小游戏 🍎</h1>
        </div>
        
        <div class="score-board">
            <div class="score">
                <h2>当前分数</h2>
                <div class="score-value">0</div>
            </div>
            <div class="high-score">
                <h2>最高分数</h2>
                <div class="high-score-value">0</div>
            </div>
        </div>
        
        <div class="game-board">
            <canvas id="game-canvas" width="400" height="400"></canvas>
            <div class="game-start" id="start-screen">
                <h2>贪吃蛇游戏</h2>
                <p>使用方向键控制蛇的移动</p>
                <div class="direction-indicator">
                    <div class="direction-row">
                        <div class="direction-key" id="key-up">↑</div>
                    </div>
                    <div class="direction-row">
                        <div class="direction-key" id="key-left">←</div>
                        <div class="direction-key" id="key-down">↓</div>
                        <div class="direction-key" id="key-right">→</div>
                    </div>
                </div>
                <button id="start-button">开始游戏</button>
            </div>
            <div class="game-over" id="game-over-screen">
                <h2>游戏结束!</h2>
                <p>你的分数: <span class="final-score">0</span></p>
                <!-- 提交区域：调整结构为flex列布局，与之前一致 -->
                <div class="score-submit mt-4 hidden" id="score-submit">
                    <input type="text" id="player-name" placeholder="输入你的昵称" />
                    <button id="submit-score">提交成绩</button>
                </div>
                <button id="restart-button">重新开始</button>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="location.href='index.html'">
                返回首页 <i class="fa fa-home ml-2"></i>
            </button>
            <button id="pause-button">暂停游戏</button>
        </div>
        
        <div class="instructions">
            <h2>游戏说明</h2>
            <p>使用键盘方向键(↑, ↓, ←, →)控制蛇的移动方向</p>
            <p>吃到食物(🍎)可以增加分数和蛇的长度</p>
            <p>撞到墙壁或自己的身体会导致游戏结束</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 获取Canvas和上下文
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            
            // 游戏变量
            const gridSize = 20;
            const tileCount = canvas.width / gridSize;
            let snake = [];
            let food = {};
            let dx = 1; // 初始向右移动
            let dy = 0;
            let score = 0;
            let highScore = localStorage.getItem('snakeHighScore') || 0;
            let gameSpeed = 8;
            let gameRunning = false;
            let gameLoop;
            
            // DOM元素
            const scoreValue = document.querySelector('.score-value');
            const highScoreValue = document.querySelector('.high-score-value');
            const finalScore = document.querySelector('.final-score');
            const gameOverScreen = document.getElementById('game-over-screen');
            const startScreen = document.getElementById('start-screen');
            const startButton = document.getElementById('start-button');
            const pauseButton = document.getElementById('pause-button');
            const restartButton = document.getElementById('restart-button');
            
            // 方向键元素
            const keyUp = document.getElementById('key-up');
            const keyDown = document.getElementById('key-down');
            const keyLeft = document.getElementById('key-left');
            const keyRight = document.getElementById('key-right');
            
            // 初始化最高分
            highScoreValue.textContent = highScore;
            
            // 初始化游戏
            function initGame() {
                // 初始化蛇
                snake = [
                    {x: 10, y: 10},
                    {x: 9, y: 10},
                    {x: 8, y: 10}
                ];
                
                // 初始向右移动
                dx = 1;
                dy = 0;
                updateDirectionIndicator();
                
                // 生成食物
                generateFood();
                
                // 重置分数
                score = 0;
                scoreValue.textContent = score;
                
                // 隐藏游戏结束屏幕
                gameOverScreen.style.display = 'none';
                startScreen.style.display = 'none';
            }
            
            // 更新方向指示器
            function updateDirectionIndicator() {
                // 重置所有键
                keyUp.classList.remove('active-key');
                keyDown.classList.remove('active-key');
                keyLeft.classList.remove('active-key');
                keyRight.classList.remove('active-key');
                
                // 激活当前方向键
                if (dx === 0 && dy === -1) keyUp.classList.add('active-key');
                if (dx === 0 && dy === 1) keyDown.classList.add('active-key');
                if (dx === -1 && dy === 0) keyLeft.classList.add('active-key');
                if (dx === 1 && dy === 0) keyRight.classList.add('active-key');
            }
            
            // 生成食物
            function generateFood() {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                
                // 确保食物不会生成在蛇身上
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        return generateFood();
                    }
                }
            }
            
            // 绘制游戏元素
            function draw() {
                // 清除画布
                ctx.fillStyle = '#061c25';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制网格
                ctx.strokeStyle = '#0a2e3b';
                for (let i = 0; i < tileCount; i++) {
                    for (let j = 0; j < tileCount; j++) {
                        ctx.strokeRect(i * gridSize, j * gridSize, gridSize, gridSize);
                    }
                }
                
                // 绘制蛇
                snake.forEach((part, index) => {
                    if (index === 0) {
                        ctx.fillStyle = '#4CAF50'; // 蛇头颜色
                    } else {
                        ctx.fillStyle = '#8BC34A'; // 蛇身颜色
                    }
                    ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                    
                    // 蛇身边框
                    ctx.strokeStyle = '#388E3C';
                    ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                    
                    // 绘制蛇眼睛
                    if (index === 0) {
                        ctx.fillStyle = 'white';
                        // 根据方向绘制眼睛
                        const eyeSize = gridSize / 5;
                        const offset = gridSize / 3;
                        
                        if (dx === 1) { // 向右
                            ctx.beginPath();
                            ctx.arc(part.x * gridSize + gridSize - offset, part.y * gridSize + offset, eyeSize, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.beginPath();
                            ctx.arc(part.x * gridSize + gridSize - offset, part.y * gridSize + gridSize - offset, eyeSize, 0, Math.PI * 2);
                            ctx.fill();
                        } else if (dx === -1) { // 向左
                            ctx.beginPath();
                            ctx.arc(part.x * gridSize + offset, part.y * gridSize + offset, eyeSize, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.beginPath();
                            ctx.arc(part.x * gridSize + offset, part.y * gridSize + gridSize - offset, eyeSize, 0, Math.PI * 2);
                            ctx.fill();
                        } else if (dy === 1) { // 向下
                            ctx.beginPath();
                            ctx.arc(part.x * gridSize + offset, part.y * gridSize + gridSize - offset, eyeSize, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.beginPath();
                            ctx.arc(part.x * gridSize + gridSize - offset, part.y * gridSize + gridSize - offset, eyeSize, 0, Math.PI * 2);
                            ctx.fill();
                        } else if (dy === -1) { // 向上
                            ctx.beginPath();
                            ctx.arc(part.x * gridSize + offset, part.y * gridSize + offset, eyeSize, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.beginPath();
                            ctx.arc(part.x * gridSize + gridSize - offset, part.y * gridSize + offset, eyeSize, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                });
                
                // 绘制食物
                ctx.fillStyle = '#FF5252';
                ctx.beginPath();
                const foodX = food.x * gridSize + gridSize/2;
                const foodY = food.y * gridSize + gridSize/2;
                ctx.arc(foodX, foodY, gridSize/2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 移动蛇
            function moveSnake() {
                const head = {x: snake[0].x + dx, y: snake[0].y + dy};
                
                // 检查游戏结束条件
                if (isCollision(head)) {
                    gameOver();
                    return;
                }
                
                // 将新头部添加到蛇数组
                snake.unshift(head);
                
                // 检查是否吃到食物
                if (head.x === food.x && head.y === food.y) {
                    // 增加分数
                    score += 10;
                    scoreValue.textContent = score;
                    
                    // 生成新食物
                    generateFood();
                    
                    // // 稍微加快游戏速度
                    // if (score % 50 === 0 && gameSpeed < 20) {
                    //     gameSpeed += 2;
                    //     clearInterval(gameLoop);
                    //     gameLoop = setInterval(main, 1000 / gameSpeed);
                    // }
                } else {
                    // 如果没吃到食物，移除尾部
                    snake.pop();
                }
            }
            
            // 检查碰撞
            function isCollision(head) {
                // 检查墙壁碰撞
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    return true;
                }
                
                // 检查自身碰撞
                for (let i = 1; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        return true;
                    }
                }
                
                return false;
            }
            
            // 游戏结束
            function gameOver() {
                gameRunning = false;
                clearInterval(gameLoop);
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    highScoreValue.textContent = highScore;
                }
                
                // 显示游戏结束屏幕
                finalScore.textContent = score;
                gameOverScreen.style.display = 'flex';
                document.getElementById('score-submit').classList.remove('hidden');

            }

            // 提交成绩逻辑（功能不变，样式已通过CSS统一）
            document.getElementById('submit-score').addEventListener('click', () => {
                const playerName = document.getElementById('player-name').value || '匿名玩家';
                submitScore('snake', { player: playerName, score: score, date: new Date().toISOString() });
                document.getElementById('score-submit').classList.add('hidden');
            });

            // 提交成绩函数
            function submitScore(game, data) {
                const leaderboard = JSON.parse(localStorage.getItem(`${game}_leaderboard`) || '[]');
                leaderboard.push(data);
                localStorage.setItem(`${game}_leaderboard`, JSON.stringify(leaderboard));
                startGame();
                // 清除填写的昵称
                document.getElementById('player-name').value = '';
            }
            
            // 游戏主循环
            function main() {
                moveSnake();
                draw();
            }
            
            // 开始游戏
            function startGame() {
                if (!gameRunning) {
                    initGame();
                    gameRunning = true;
                    gameLoop = setInterval(main, 1000 / gameSpeed);
                    pauseButton.textContent = "暂停游戏";
                }
            }
            
            // 暂停游戏
            function pauseGame() {
                if (gameRunning) {
                    gameRunning = false;
                    clearInterval(gameLoop);
                    pauseButton.textContent = "继续游戏";
                } else {
                    gameRunning = true;
                    gameLoop = setInterval(main, 1000 / gameSpeed);
                    pauseButton.textContent = "暂停游戏";
                }
            }
            
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                // 防止方向键滚动页面
                if ([37, 38, 39, 40].includes(e.keyCode)) {
                    e.preventDefault();
                }
                
                // 上箭头: 不能直接从向下变为向上
                if (e.keyCode === 38 && dy !== 1) {
                    dx = 0;
                    dy = -1;
                    updateDirectionIndicator();
                }
                // 下箭头: 不能直接从向上变为向下
                else if (e.keyCode === 40 && dy !== -1) {
                    dx = 0;
                    dy = 1;
                    updateDirectionIndicator();
                }
                // 左箭头: 不能直接从向右变为向左
                else if (e.keyCode === 37 && dx !== 1) {
                    dx = -1;
                    dy = 0;
                    updateDirectionIndicator();
                }
                // 右箭头: 不能直接从向左变为向右
                else if (e.keyCode === 39 && dx !== -1) {
                    dx = 1;
                    dy = 0;
                    updateDirectionIndicator();
                }
                // 空格键: 暂停/继续
                else if (e.keyCode === 32) {
                    pauseGame();
                }
            });
            
            // 按钮事件监听
            startButton.addEventListener('click', startGame);
            pauseButton.addEventListener('click', pauseGame);
            restartButton.addEventListener('click', startGame);
            
            // 初始绘制
            draw();
        });
    </script>
</body>
</html>
