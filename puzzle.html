<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼图小游戏 - 修复版（支持随机新图）</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 90vw;
        }
        
        .game-header {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .game-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .score-board {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            justify-content: center;
        }
        
        .moves, .time, .difficulty {
            text-align: center;
            color: white;
        }
        
        .moves h2, .time h2, .difficulty h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        
        .moves-value, .time-value, .difficulty-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .game-board {
            position: relative;
            background: #061c25;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: grid;
            gap: 2px;
            padding: 2px;
            transition: all 0.3s ease;
        }
        
        .puzzle-piece {
            background-color: #1e3a5f;
            background-repeat: no-repeat;
            cursor: grab;
            transition: all 0.2s ease;
            user-select: none;
            position: relative;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .puzzle-piece::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            transition: opacity 0.2s ease;
            opacity: 0;
        }
        
        .puzzle-piece:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(255, 138, 0, 0.5);
        }
        
        .puzzle-piece:hover::after {
            opacity: 1;
        }
        
        .puzzle-piece.dragging {
            opacity: 0.8;
            transform: scale(1.05);
            cursor: grabbing;
            box-shadow: 0 0 20px rgba(255, 138, 0, 0.8);
            z-index: 10;
        }
        
        .puzzle-piece.target {
            background: rgba(255, 138, 0, 0.2);
            animation: pulse 0.5s infinite alternate;
        }
        
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(0.95); }
        }
        
        .puzzle-piece.swapping {
            animation: swapAnimation 0.3s ease-in-out;
        }
        
        @keyframes swapAnimation {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); }
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(to right, #ff8a00, #da1b60);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .instructions {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            color: white;
            max-width: 500px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .instructions h2 {
            margin-bottom: 15px;
            color: #ff8a00;
        }
        
        .instructions p {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .game-over, .game-start {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            border-radius: 10px;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }
        
        .game-start {
            display: flex;
        }
        
        .game-over {
            display: none;
        }
        
        .difficulty-selector {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        
        .difficulty-btn {
            padding: 8px 15px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .difficulty-btn.active {
            background: linear-gradient(to right, #4CAF50, #8BC34A);
        }
        
        .preview-image {
            max-width: 200px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            margin-top: 15px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .preview-image:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* 统一提交成绩区域样式（与记忆卡牌游戏保持一致） */
        .score-submit {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 350px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        #player-name {
            padding: 12px 15px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            color: #333;
            background: white;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            outline: none;
            transition: box-shadow 0.3s ease;
        }
        #player-name:focus {
            box-shadow: 0 0 0 2px rgba(255, 138, 0, 0.5);
        }
        #submit-score {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(to right, #ff8a00, #da1b60);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        #submit-score:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        #submit-score:active {
            transform: translateY(1px);
        }
        
        #restart-button {
            margin-top: 10px;
        }
        
        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                padding: 10px 20px;
            }
            
            .game-header h1 {
                font-size: 2rem;
            }
            
            .score-board {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }

            .score-submit {
                margin-bottom: 15px;
            }
            #player-name, #submit-score {
                padding: 10px 15px;
                font-size: 1rem;
            }
            
            #restart-button {
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h1>🧩 拼图小游戏 🎮</h1>
        </div>
        
        <div class="score-board">
            <div class="moves">
                <h2>移动次数</h2>
                <div class="moves-value">0</div>
            </div>
            <div class="time">
                <h2>用时</h2>
                <div class="time-value">00:00</div>
            </div>
            <div class="difficulty">
                <h2>难度</h2>
                <div class="difficulty-value">3x3</div>
            </div>
        </div>
        
        <div class="game-board" id="puzzle-board" style="width: 400px; height: 400px;">
            <!-- 拼图碎片将通过JS动态生成 -->
        </div>
        
        <div class="controls">
            <button onclick="location.href='index.html'">
                返回首页 <i class="fa fa-home ml-2"></i>
            </button>
            <button id="shuffle-button">重新打乱</button>
            <button id="pause-button">暂停游戏</button>
            <button id="change-difficulty-button">重选难度</button>
        </div>
        
        <div class="instructions">
            <h2>游戏说明</h2>
            <p>拖动任意拼图碎片到目标位置，与之交换</p>
            <p>将所有碎片拼回原图即可获胜</p>
            <p>完成时间越短，移动次数越少，成绩越好</p>
            <!-- 预览图：将通过JS动态更新 -->
            <img src="" alt="拼图原图预览" class="preview-image" id="preview-img">
        </div>
        
        <div class="game-start" id="start-screen">
            <h2>拼图游戏</h2>
            <p>选择难度开始游戏</p>
            <div class="difficulty-selector">
                <button class="difficulty-btn active" data-size="3">3x3</button>
                <button class="difficulty-btn" data-size="4">4x4</button>
                <button class="difficulty-btn" data-size="5">5x5</button>
            </div>
            <button id="start-button">开始游戏</button>
        </div>
        
        <div class="game-over" id="game-over-screen">
            <h2>恭喜完成!</h2>
            <p>移动次数: <span class="final-moves">0</span></p>
            <p>用时: <span class="final-time">00:00</span></p>
            <div class="score-submit mt-4 hidden" id="score-submit">
                <input type="text" id="player-name" placeholder="输入你的昵称">
                <button id="submit-score">提交成绩</button>
            </div>
            <button id="restart-button">再玩一次</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 游戏核心变量
            const puzzleBoard = document.getElementById('puzzle-board');
            let puzzleSize = 3; // 默认3x3
            let pieces = []; // 存储碎片数据：{ currentIndex, correctIndex, element }
            let moves = 0;
            let seconds = 0;
            let timer = null;
            let gameRunning = false;
            let draggedPiece = null; // 正在拖拽的碎片
            let imageUrl = ''; // 改为空变量，每次游戏初始化时生成新URL
            const previewImg = document.getElementById('preview-img'); // 预览图DOM
            
            // DOM元素缓存
            const movesValue = document.querySelector('.moves-value');
            const timeValue = document.querySelector('.time-value');
            const difficultyValue = document.querySelector('.difficulty-value');
            const finalMoves = document.querySelector('.final-moves');
            const finalTime = document.querySelector('.final-time');
            const gameOverScreen = document.getElementById('game-over-screen');
            const startScreen = document.getElementById('start-screen');
            const startButton = document.getElementById('start-button');
            const shuffleButton = document.getElementById('shuffle-button');
            const pauseButton = document.getElementById('pause-button');
            const restartButton = document.getElementById('restart-button');
            const changeDifficultyButton = document.getElementById('change-difficulty-button');
            const difficultyButtons = document.querySelectorAll('.difficulty-btn');
            
            // 生成随机图片URL的函数
            function getRandomImageUrl() {
                return `https://picsum.photos/400/400?random=${Date.now()}`;
            }
            
            // 难度选择逻辑
            difficultyButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    difficultyButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    puzzleSize = parseInt(btn.dataset.size);
                    difficultyValue.textContent = `${puzzleSize}x${puzzleSize}`;
                    // 调整游戏板尺寸
                    const boardSize = Math.min(400, window.innerWidth - 40);
                    const adjustedSize = Math.floor(boardSize / puzzleSize) * puzzleSize;
                    puzzleBoard.style.width = `${adjustedSize}px`;
                    puzzleBoard.style.height = `${adjustedSize}px`;
                });
            });
            
            // 拼图初始化逻辑
            function initPuzzle() {
                // 清空游戏板和碎片数据
                puzzleBoard.innerHTML = '';
                pieces = [];
                moves = 0;
                seconds = 0;
                movesValue.textContent = '0';
                timeValue.textContent = '00:00';
                
                // 计算游戏板和碎片尺寸
                const boardSize = puzzleBoard.offsetWidth;
                const pieceSize = boardSize / puzzleSize;
                
                // 设置网格布局
                puzzleBoard.style.gridTemplateColumns = `repeat(${puzzleSize}, 1fr)`;
                puzzleBoard.style.gridTemplateRows = `repeat(${puzzleSize}, 1fr)`;
                
                // 创建碎片
                for (let i = 0; i < puzzleSize * puzzleSize; i++) {
                    const piece = document.createElement('div');
                    piece.classList.add('puzzle-piece');
                    piece.draggable = true;
                    
                    // 碎片位置计算
                    const correctRow = Math.floor(i / puzzleSize);
                    const correctCol = i % puzzleSize;
                    const bgX = -correctCol * pieceSize;
                    const bgY = -correctRow * pieceSize;
                    
                    piece.style.backgroundImage = `url(${imageUrl})`;
                    piece.style.backgroundSize = `${boardSize}px ${boardSize}px`;
                    piece.style.backgroundPosition = `${bgX}px ${bgY}px`;
                    
                    // 碎片数据存储
                    const pieceData = {
                        currentIndex: i,
                        correctIndex: i,
                        element: piece
                    };
                    pieces.push(pieceData);
                    
                    // 绑定拖拽事件
                    bindDragEvents(piece, pieceData);
                    
                    // 添加到游戏板
                    puzzleBoard.appendChild(piece);
                }
            }
            
            // 拖拽事件逻辑
            function bindDragEvents(pieceElement, pieceData) {
                // 拖拽开始
                pieceElement.addEventListener('dragstart', (e) => {
                    if (!gameRunning) return;
                    draggedPiece = pieceData;
                    e.dataTransfer.setData('text/plain', pieceData.currentIndex);
                    setTimeout(() => pieceElement.classList.add('dragging'), 0);
                });
                
                // 拖拽结束
                pieceElement.addEventListener('dragend', () => {
                    pieceElement.classList.remove('dragging');
                    pieces.forEach(p => p.element.classList.remove('target'));
                    draggedPiece = null;
                });
                
                // 拖拽经过
                pieceElement.addEventListener('dragover', (e) => {
                    if (!gameRunning || !draggedPiece || pieceData === draggedPiece) return;
                    e.preventDefault();
                });
                
                // 拖拽进入
                pieceElement.addEventListener('dragenter', (e) => {
                    if (!gameRunning || !draggedPiece || pieceData === draggedPiece) return;
                    e.preventDefault();
                    pieceElement.classList.add('target');
                });
                
                // 拖拽离开
                pieceElement.addEventListener('dragleave', () => {
                    if (pieceData.element.classList.contains('target')) {
                        pieceData.element.classList.remove('target');
                    }
                });
                
                // 拖拽释放
                pieceElement.addEventListener('drop', (e) => {
                    if (!gameRunning || !draggedPiece || pieceData === draggedPiece) return;
                    e.preventDefault();
                    pieceElement.classList.remove('target');
                    swapPieces(draggedPiece, pieceData);
                });
            }
            
            // 碎片交换逻辑
            function swapPieces(pieceA, pieceB) {
                // 交换数据索引
                const tempIndex = pieceA.currentIndex;
                pieceA.currentIndex = pieceB.currentIndex;
                pieceB.currentIndex = tempIndex;
                
                // 交换DOM位置
                renderPieces();
                
                // 添加交换动画
                pieceA.element.classList.add('swapping');
                pieceB.element.classList.add('swapping');
                setTimeout(() => {
                    pieceA.element.classList.remove('swapping');
                    pieceB.element.classList.remove('swapping');
                }, 300);
                
                // 更新移动次数
                moves++;
                movesValue.textContent = moves;
                
                // 检查是否完成拼图
                checkCompletion();
            }
            
            // 碎片渲染逻辑
            function renderPieces() {
                puzzleBoard.innerHTML = '';
                pieces.sort((a, b) => a.currentIndex - b.currentIndex)
                    .forEach(piece => puzzleBoard.appendChild(piece.element));
            }
            
            // 打乱逻辑
            function shufflePuzzle() {
                // Fisher-Yates洗牌算法
                for (let i = pieces.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pieces[i].currentIndex, pieces[j].currentIndex] = [pieces[j].currentIndex, pieces[i].currentIndex];
                }
                
                // 检查是否打乱后直接完成
                if (checkCompletion(false)) {
                    shufflePuzzle();
                }
                
                // 重新渲染碎片位置
                renderPieces();
                
                // 重置移动次数
                moves = 0;
                movesValue.textContent = '0';
            }
            
            // 完成判断逻辑
            function checkCompletion(showOverScreen = true) {
                const isComplete = pieces.every(piece => piece.currentIndex === piece.correctIndex);
                if (isComplete && showOverScreen && gameRunning) {
                    // 游戏结束
                    gameRunning = false;
                    clearInterval(timer);
                    finalMoves.textContent = moves;
                    finalTime.textContent = formatTime(seconds);
                    gameOverScreen.style.display = 'flex';
                    
                    // 显示成绩提交表单
                    document.getElementById('score-submit').classList.remove('hidden');
                }
                return isComplete;
            }

            // 提交成绩逻辑
            document.getElementById('submit-score').addEventListener('click', () => {
                const playerName = document.getElementById('player-name').value || '匿名玩家';
                const difficulty = ['easy', 'medium', 'hard'][puzzleSize - 3];
                submitScore(`puzzle_${difficulty}`, { 
                    player: playerName, 
                    moves: moves, 
                    time: seconds, 
                    date: new Date().toISOString() 
                });
                document.getElementById('score-submit').classList.add('hidden');
                document.getElementById('player-name').value = '';
                startGame();
            });

            // 提交成绩函数
            function submitScore(game, data) {
                const leaderboard = JSON.parse(localStorage.getItem(`${game}_leaderboard`) || '[]');
                leaderboard.push(data);
                localStorage.setItem(`${game}_leaderboard`, JSON.stringify(leaderboard));
            }

            // 窗口resize逻辑
            function handleResize() {
                if (!gameRunning && startScreen.style.display !== 'none') return;
                
                // 调整游戏板尺寸
                const boardSize = Math.min(400, window.innerWidth - 40);
                const adjustedSize = Math.floor(boardSize / puzzleSize) * puzzleSize;
                puzzleBoard.style.width = `${adjustedSize}px`;
                puzzleBoard.style.height = `${adjustedSize}px`;
                
                // 更新所有碎片的背景尺寸和位置
                const pieceSize = adjustedSize / puzzleSize;
                pieces.forEach(piece => {
                    const correctRow = Math.floor(piece.correctIndex / puzzleSize);
                    const correctCol = piece.correctIndex % puzzleSize;
                    const bgX = -correctCol * pieceSize;
                    const bgY = -correctRow * pieceSize;
                    
                    piece.element.style.backgroundSize = `${adjustedSize}px ${adjustedSize}px`;
                    piece.element.style.backgroundPosition = `${bgX}px ${bgY}px`;
                });
                
                // 重新渲染碎片
                renderPieces();
            }
            
            // 工具函数：格式化时间
            function formatTime(secs) {
                const minutes = Math.floor(secs / 60);
                const seconds = secs % 60;
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
            
            // 工具函数：更新计时器
            function updateTimer() {
                seconds++;
                timeValue.textContent = formatTime(seconds);
            }
            
            // 开始游戏
            function startGame() {
                // 获取随机新图片URL
                imageUrl = getRandomImageUrl();
                // 更新预览图
                previewImg.src = imageUrl;
                previewImg.alt = `拼图原图（${puzzleSize}x${puzzleSize}）`;
                
                // 初始化拼图
                initPuzzle();
                // 打乱拼图
                shufflePuzzle();
                // 启动游戏状态
                gameRunning = true;
                startScreen.style.display = 'none';
                gameOverScreen.style.display = 'none';
                // 启动计时器
                clearInterval(timer);
                timer = setInterval(updateTimer, 1000);
                // 更新暂停按钮文本
                pauseButton.textContent = "暂停游戏";
            }
            
            // 暂停逻辑
            function togglePause() {
                if (startScreen.style.display !== 'none' || gameOverScreen.style.display !== 'none') {
                    return;
                }
                
                if (gameRunning) {
                    // 暂停
                    gameRunning = false;
                    clearInterval(timer);
                    pauseButton.textContent = "继续游戏";
                } else {
                    // 继续
                    gameRunning = true;
                    timer = setInterval(updateTimer, 1000);
                    pauseButton.textContent = "暂停游戏";
                }
            }
            
            // 重新打乱逻辑
            function handleShuffle() {
                if (!gameRunning || startScreen.style.display !== 'none') return;
                
                // 重置计时器
                seconds = 0;
                timeValue.textContent = '00:00';
                clearInterval(timer);
                timer = setInterval(updateTimer, 1000);
                
                // 重新打乱
                shufflePuzzle();
            }
            
            // 重选难度
            function showDifficultySelection() {
                // 停止游戏和计时器
                gameRunning = false;
                clearInterval(timer);
                
                // 显示开始界面
                startScreen.style.display = 'flex';
                gameOverScreen.style.display = 'none';
                
                // 清空游戏板
                puzzleBoard.innerHTML = '';
                pieces = [];
            }
            
            // 事件监听绑定
            startButton.addEventListener('click', startGame);
            shuffleButton.addEventListener('click', handleShuffle);
            pauseButton.addEventListener('click', togglePause);
            restartButton.addEventListener('click', startGame);
            changeDifficultyButton.addEventListener('click', showDifficultySelection);
            window.addEventListener('resize', handleResize);
            
            // 初始化游戏板尺寸
            const initBoardSize = Math.min(400, window.innerWidth - 40);
            const adjustedInitSize = Math.floor(initBoardSize / puzzleSize) * puzzleSize;
            puzzleBoard.style.width = `${adjustedInitSize}px`;
            puzzleBoard.style.height = `${adjustedInitSize}px`;
            
            // 首次加载时默认显示一张预览图
            previewImg.src = getRandomImageUrl();
            previewImg.alt = "拼图原图预览";
        });
    </script>
</body>
</html>
