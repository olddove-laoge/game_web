<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻记忆卡牌 - 记忆挑战</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 1200px; /* 增加最大宽度 */
        }
        
        .game-header {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .game-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .stats-board {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            justify-content: center;
        }
        
        .moves, .time, .pairs {
            text-align: center;
            color: white;
        }
        
        .moves h2, .time h2, .pairs h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        
        .moves-value, .time-value, .pairs-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .difficulty {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 10px;
        }
        
        .difficulty-button {
            padding: 8px 15px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .difficulty-button.active {
            background: linear-gradient(to right, #ff8a00, #da1b60);
        }
        
        .game-board {
            position: relative;
            background: #061c25;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            padding: 20px;
            display: grid;
            gap: 15px;
            perspective: 1000px;
            width: 100%;
            justify-items: center; /* 居中卡牌 */
        }
        
        .card {
            width: 100%;
            max-width: 100px; /* 卡牌最大宽度 */
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            cursor: pointer;
        }
        
        .card.flipped {
            transform: rotateY(180deg);
        }
        
        .card.matched {
            animation: matched 0.5s;
        }
        
        @keyframes matched {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }
        
        .card-back {
            background: linear-gradient(to right, #ff8a00, #da1b60);
        }
        
        .card-front {
            background: #4CAF50;
            transform: rotateY(180deg);
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(to right, #ff8a00, #da1b60);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .instructions {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            color: white;
            max-width: 500px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .instructions h2 {
            margin-bottom: 15px;
            color: #ff8a00;
        }
        
        .instructions p {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .game-over, .game-start {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            border-radius: 10px;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        
        .game-start {
            display: flex;
        }
        
        .game-over {
            display: none;
        }
        
        .final-stats {
            margin: 20px 0;
            text-align: center;
        }
        
        .final-stat {
            margin: 10px 0;
            font-size: 1.5rem;
        }

        /* ============================================== */
        /* 统一提交成绩区域样式（与颜色误导/贪吃蛇游戏保持一致） */
        /* ============================================== */
        .score-submit {
            display: flex;
            flex-direction: column;
            gap: 10px; /* 输入框与按钮间距 */
            width: 100%;
            max-width: 350px; /* 限制最大宽度，避免过宽 */
            margin-top: 10px;
            margin-bottom: 20px; /* 增加底部间距，与再玩一次按钮分隔开 */
        }
        #player-name {
            padding: 12px 15px; /* 统一内边距 */
            border: none;
            border-radius: 50px; /* 圆角设计 */
            font-size: 1rem;
            color: #333; /* 文本颜色 */
            background: white; /* 白色背景，与之前一致 */
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2); /* 轻微阴影 */
            outline: none;
            transition: box-shadow 0.3s ease;
        }
        #player-name:focus {
            box-shadow: 0 0 0 2px rgba(255, 138, 0, 0.5); /* 聚焦时高亮 */
        }
        #submit-score {
            padding: 12px 25px; /* 与其他按钮统一内边距 */
            border: none;
            border-radius: 50px; /* 圆角 */
            background: linear-gradient(to right, #ff8a00, #da1b60); /* 统一渐变色 */
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        #submit-score:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        #submit-score:active {
            transform: translateY(1px);
        }
        
        /* 增加再玩一次按钮的顶部间距 */
        #play-again-button {
            margin-top: 10px;
        }
        /* ============================================== */
        
        @media (max-width: 1024px) {
            .card {
                max-width: 90px;
                height: 90px;
            }
        }
        
        @media (max-width: 768px) {
            .card {
                max-width: 80px;
                height: 80px;
            }
            
            .stats-board {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                padding: 10px 20px;
            }
            
            .game-header h1 {
                font-size: 2rem;
            }

            /* 小屏幕提交区域适配 */
            .score-submit {
                padding: 0 10px;
                margin-bottom: 15px; /* 小屏幕适当减少间距 */
            }
            #player-name, #submit-score {
                padding: 10px 15px;
                font-size: 1rem;
            }
            
            #play-again-button {
                margin-top: 5px; /* 小屏幕适当减少间距 */
            }
        }
        
        @media (max-width: 480px) {
            .card {
                max-width: 70px;
                height: 70px;
            }
            
            .card-face {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 360px) {
            .card {
                max-width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h1>🧠 翻记忆卡牌 🃏</h1>
        </div>
        
        <div class="difficulty">
            <button class="difficulty-button active" data-size="4">简单 (4x4)</button>
            <button class="difficulty-button" data-size="6">中等 (6x6)</button>
            <button class="difficulty-button" data-size="8">困难 (8x8)</button>
        </div>
        
        <div class="stats-board">
            <div class="moves">
                <h2>翻牌次数</h2>
                <div class="moves-value">0</div>
            </div>
            <div class="time">
                <h2>用时</h2>
                <div class="time-value">00:00</div>
            </div>
            <div class="pairs">
                <h2>已匹配</h2>
                <div class="pairs-value">0/0</div>
            </div>
        </div>
        
        <div class="game-board" id="game-board">
            <!-- 卡牌将通过JavaScript动态生成 -->
        </div>
        
        <div class="controls">
            <button onclick="location.href='index.html'">
                返回首页 <i class="fa fa-home ml-2"></i>
            </button>
            <button id="start-button">开始游戏</button>
            <button id="reset-button">重新开始</button>
        </div>
        
        <div class="instructions">
            <h2>游戏说明</h2>
            <p>翻开花样相同的卡牌进行匹配</p>
            <p>每次只能翻开两张牌，如果匹配成功则保持翻开状态</p>
            <p>翻牌次数越少，用时越短，成绩越好</p>
            <p>可以选择不同难度级别挑战自己的记忆力</p>
        </div>
        
        <div class="game-start" id="start-screen">
            <h2>翻记忆卡牌</h2>
            <p>挑战你的记忆力</p>
            <button id="play-button">开始游戏</button>
        </div>
        
        <div class="game-over" id="game-over-screen">
            <h2>恭喜你!</h2>
            <div class="final-stats">
                <div class="final-stat">翻牌次数: <span class="final-moves">0</span></div>
                <div class="final-stat">用时: <span class="final-time">00:00</span></div>
            </div>
            <!-- 提交区域：使用统一样式结构 -->
            <div class="score-submit mt-4 hidden" id="score-submit">
                <input type="text" id="player-name" placeholder="输入你的昵称" />
                <button id="submit-score">提交成绩</button>
            </div>
            <button id="play-again-button">再玩一次</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 游戏变量
            const gameBoard = document.getElementById('game-board');
            let cards = [];
            let flippedCards = [];
            let matchedPairs = 0;
            let totalPairs = 0;
            let moves = 0;
            let gameStarted = false;
            let gameTimer;
            let seconds = 0;
            let boardSize = 4; // 默认4x4
            
            // 卡牌图标集合
            const icons = ['🍎', '🍐', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓', '🍒', '🥭', '🥑', '🥝', '🍍', '🥥', '🍑', '🍅', '🍆', '🥔', '🥕', '🌽', '🥒', '🥬', '🥦', '🧄', '🧅', '🍄', '🥜', '🌰', '🍞', '🍩', '🍪', '🎂'];
            
            // DOM元素
            const movesValue = document.querySelector('.moves-value');
            const timeValue = document.querySelector('.time-value');
            const pairsValue = document.querySelector('.pairs-value');
            const startButton = document.getElementById('start-button');
            const resetButton = document.getElementById('reset-button');
            const playButton = document.getElementById('play-button');
            const playAgainButton = document.getElementById('play-again-button');
            const startScreen = document.getElementById('start-screen');
            const gameOverScreen = document.getElementById('game-over-screen');
            const finalMoves = document.querySelector('.final-moves');
            const finalTime = document.querySelector('.final-time');
            const difficultyButtons = document.querySelectorAll('.difficulty-button');
            
            // 初始化游戏
            function initGame(size = 4) {
                // 重置游戏状态
                clearInterval(gameTimer);
                seconds = 0;
                moves = 0;
                matchedPairs = 0;
                flippedCards = [];
                gameStarted = false;
                boardSize = size;
                
                // 更新UI
                movesValue.textContent = '0';
                timeValue.textContent = '00:00';
                
                // 设置游戏板大小和网格列数
                gameBoard.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
                
                // 清空游戏板
                gameBoard.innerHTML = '';
                
                // 计算总牌对数
                totalPairs = (size * size) / 2;
                pairsValue.textContent = `0/${totalPairs}`;
                
                // 创建卡牌对
                createCardPairs();
                
                // 隐藏游戏结束屏幕
                gameOverScreen.style.display = 'none';
            }
            
            // 创建卡牌对
            function createCardPairs() {
                // 选择需要的图标数量
                const usedIcons = icons.slice(0, totalPairs);
                // 复制一份形成配对
                const cardIcons = [...usedIcons, ...usedIcons];
                // 打乱顺序
                shuffleArray(cardIcons);
                
                // 创建卡牌元素
                cardIcons.forEach((icon, index) => {
                    const card = document.createElement('div');
                    card.classList.add('card');
                    card.dataset.index = index;
                    
                    const cardBack = document.createElement('div');
                    cardBack.classList.add('card-face', 'card-back');
                    
                    const cardFront = document.createElement('div');
                    cardFront.classList.add('card-face', 'card-front');
                    cardFront.textContent = icon;
                    
                    card.appendChild(cardBack);
                    card.appendChild(cardFront);
                    
                    // 添加点击事件
                    card.addEventListener('click', flipCard);
                    
                    gameBoard.appendChild(card);
                });
                
                // 保存卡牌引用
                cards = document.querySelectorAll('.card');
            }
            
            // 翻转卡牌
            function flipCard() {
                // 如果游戏未开始，启动计时器
                if (!gameStarted) {
                    gameStarted = true;
                    startTimer();
                }
                
                const card = this;
                
                // 忽略已匹配的卡牌和已翻开的卡牌
                if (card.classList.contains('matched') || card.classList.contains('flipped') || flippedCards.length >= 2) {
                    return;
                }
                
                // 翻转卡牌
                card.classList.add('flipped');
                flippedCards.push(card);
                
                // 当翻开两张牌时检查匹配
                if (flippedCards.length === 2) {
                    moves++;
                    movesValue.textContent = moves;
                    checkForMatch();
                }
            }
            
            // 检查匹配
            function checkForMatch() {
                const [card1, card2] = flippedCards;
                const icon1 = card1.querySelector('.card-front').textContent;
                const icon2 = card2.querySelector('.card-front').textContent;
                
                if (icon1 === icon2) {
                    // 匹配成功
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    
                    // 更新匹配计数
                    pairsValue.textContent = `${matchedPairs}/${totalPairs}`;
                    
                    // 清空翻开的卡牌数组
                    flippedCards = [];
                    
                    // 检查游戏是否结束
                    if (matchedPairs === totalPairs) {
                        gameOver();
                    }
                } else {
                    // 匹配失败，稍后翻回
                    setTimeout(() => {
                        card1.classList.remove('flipped');
                        card2.classList.remove('flipped');
                        flippedCards = [];
                    }, 1000);
                }
            }
            
            // 开始计时器
            function startTimer() {
                gameTimer = setInterval(() => {
                    seconds++;
                    const minutes = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    timeValue.textContent = `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }, 1000);
            }
            
            // 游戏结束
            function gameOver() {
                clearInterval(gameTimer);
                gameStarted = false;
                
                // 更新最终统计
                finalMoves.textContent = moves;
                finalTime.textContent = timeValue.textContent;
                
                // 显示游戏结束屏幕
                gameOverScreen.style.display = 'flex';
                document.getElementById('score-submit').classList.remove('hidden');
            }

            // 提交成绩逻辑
            document.getElementById('submit-score').addEventListener('click', () => {
                const playerName = document.getElementById('player-name').value || '匿名玩家';
                const difficulty = ['easy', 'medium', 'hard'][['4', '6', '8'].indexOf(boardSize.toString())];
                submitScore(`memory_${difficulty}`, { 
                    player: playerName, 
                    moves: moves, 
                    time: seconds, 
                    date: new Date().toISOString() 
                });
                document.getElementById('score-submit').classList.add('hidden');
                // 清空输入框
                document.getElementById('player-name').value = '';
            });

            // 提交成绩函数
            function submitScore(game, data) {
                const leaderboard = JSON.parse(localStorage.getItem(`${game}_leaderboard`) || '[]');
                leaderboard.push(data);
                // 按「翻牌次数」升序排序（记忆游戏以次数少为优）
                leaderboard.sort((a, b) => a.moves - b.moves || a.time - b.time);
                localStorage.setItem(`${game}_leaderboard`, JSON.stringify(leaderboard));
                initGame(boardSize)
            }
            
            // 打乱数组顺序
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
            
            // 事件监听
            startButton.addEventListener('click', () => {
                startScreen.style.display = 'none';
                initGame(boardSize);
            });
            
            resetButton.addEventListener('click', () => {
                initGame(boardSize);
            });
            
            playButton.addEventListener('click', () => {
                startScreen.style.display = 'none';
                initGame(boardSize);
            });
            
            playAgainButton.addEventListener('click', () => {
                initGame(boardSize);
            });
            
            // 难度选择
            difficultyButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // 更新活跃状态
                    difficultyButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    
                    // 获取选择的大小并初始化游戏
                    const size = parseInt(button.dataset.size);
                    initGame(size);
                });
            });
            
            // 初始显示开始屏幕
            startScreen.style.display = 'flex';
        });
    </script>
</body>
</html>
