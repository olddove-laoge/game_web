<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色误导挑战</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff8a00',
                        secondary: '#da1b60',
                        dark: '#061c25',
                        light: 'rgba(255, 255, 255, 0.2)',
                    },
                    fontFamily: {
                        game: ['Segoe UI', 'Tahoma', 'Geneva', 'Verdana', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .text-shadow {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            }
            .bg-blur {
                -webkit-backdrop-filter: blur(10px);
                backdrop-filter: blur(10px);
            }
            .gradient-bg {
                background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            }
            .gradient-btn {
                background: linear-gradient(to right, #ff8a00, #da1b60);
            }
            .option-hover {
                transition: all 0.3s ease;
            }
            .option-hover:hover {
                transform: translateY(-3px);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            }
            .option-active {
                transform: scale(1.05);
                box-shadow: 0 5px 15px rgba(255, 138, 0, 0.5);
            }
            .timer-bar {
                transition: width 0.1s linear;
            }
        }
    </style>
    <style>
        .score-submit {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 350px;
            margin-top: 10px;
        }

        #player-name {
            padding: 12px 15px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            color: #333;
            background: white;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        #player-name:focus {
            box-shadow: 0 0 0 2px rgba(255, 138, 0, 0.5);
        }

        #submit-score {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(to right, #ff8a00, #da1b60);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        #submit-score:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        #submit-score:active {
            transform: translateY(1px);
        }

        @media (max-width: 600px) {
            .score-submit {
                padding: 0 10px;
            }

            #player-name, #submit-score {
                padding: 10px 15px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4 font-game text-white overflow-x-hidden">
    <div class="container max-w-4xl mx-auto flex flex-col items-center gap-6">
        <div class="game-header text-center z-1">
            <h1 class="text-[clamp(1.8rem,5vw,3rem)] font-bold mb-2 text-shadow">🎨 颜色误导挑战 🧠</h1>
        </div>
        
        <div class="score-board bg-light rounded-xl p-4 md:p-6 flex flex-wrap justify-center gap-6 md:gap-8 shadow-lg bg-blur w-full max-w-3xl">
            <div class="score text-center min-w-[100px]">
                <h2 class="text-lg mb-1">当前分数</h2>
                <div class="score-value text-3xl font-bold">0</div>
            </div>
            <div class="high-score text-center min-w-[100px]">
                <h2 class="text-lg mb-1">最高分数</h2>
                <div class="high-score-value text-3xl font-bold">0</div>
            </div>
            <div class="current-streak text-center min-w-[100px]">
                <h2 class="text-lg mb-1">当前连击</h2>
                <div class="streak-value text-3xl font-bold">0</div>
            </div>
        </div>
        
        <div class="w-full max-w-3xl bg-dark/50 rounded-full h-3 overflow-hidden">
            <div id="timer-bar" class="timer-bar h-full gradient-bg w-full"></div>
        </div>
        
        <div class="game-area w-full max-w-3xl bg-dark rounded-xl p-4 md:p-6 shadow-xl relative min-h-[400px] md:min-h-[450px]">
            <div class="question text-center text-[clamp(1.2rem,3vw,2rem)] mb-6 md:mb-8 min-h-[120px] flex items-center justify-center px-2">
                准备开始挑战！
            </div>
            
            <div class="options grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            </div>
            
            <div id="start-screen" class="absolute inset-0 bg-dark/90 rounded-xl flex flex-col items-center justify-center gap-6 p-6 text-center z-10">
                <h2 class="text-2xl font-bold">颜色误导挑战</h2>
                <p class="mb-4 text-base md:text-lg">注意区分文字本身和它的颜色！</p>
                <div class="instructions bg-light/50 p-4 rounded-lg text-left max-w-sm text-sm md:text-base">
                    <p class="mb-2"><i class="fa fa-check-circle text-primary mr-2"></i>回答关于文字颜色或文字内容的问题</p>
                    <p class="mb-2"><i class="fa fa-check-circle text-primary mr-2"></i>限时回答，时间会随着得分增加而减少</p>
                    <p><i class="fa fa-check-circle text-primary mr-2"></i>错误或超时都会导致游戏结束</p>
                </div>
                <button id="start-button" class="gradient-btn text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl transition-all">
                    开始游戏
                </button>
            </div>
            
            <div id="game-over-screen" class="absolute inset-0 bg-dark/90 rounded-xl flex flex-col items-center justify-center gap-4 p-6 text-center hidden z-10">
                <h2 class="text-2xl font-bold text-secondary">游戏结束!</h2>
                <p class="text-xl">你的分数: <span class="final-score font-bold">0</span></p>
                <p class="mb-4">最高连击: <span class="max-streak font-bold">0</span></p>
                <div class="score-submit mb-4 hidden" id="score-submit">
                    <input type="text" id="player-name" placeholder="输入你的昵称" />
                    <button id="submit-score">提交成绩</button>
                </div>
                <button id="restart-button" class="gradient-btn text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl transition-all">
                    重新开始
                </button>
            </div>
        </div>
        
        <div class="controls flex gap-4 mt-2">
            <a href="index.html" class="gradient-btn text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl transition-all flex items-center justify-center">
                返回首页 <i class="fa fa-home ml-2"></i>
            </a>
        </div>
        
        <div class="instructions bg-light rounded-xl p-4 md:p-5 shadow-lg bg-blur max-w-2xl w-full">
            <h2 class="text-xl font-bold mb-3 text-primary">游戏说明</h2>
            <p class="mb-2">游戏会显示颜色与文字内容不同的汉字（例如红色的"黄"字）</p>
            <p class="mb-2">会随机出现两种问题：</p>
            <ul class="list-disc list-inside mb-2 pl-4">
                <li>下列哪个字是 <span class="text-red-500 font-bold">红</span> 色的？</li>
                <li>下列哪个字是 " <span class="font-bold">蓝</span> "？</li>
            </ul>
            <p>初始答题时间为5秒，答对5、10、25题后分别变为4、3、2秒</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameConfig = {
                baseTime: 5,
                timeLevels: [5, 10, 25],
                timeReductions: [1, 2, 2],
                pointsPerQuestion: 20,
                optionsCount: 4,
                colors: {
                    '红': '#FF5252',
                    '黄': '#FFD700',
                    '蓝': '#42A5F5',
                    '绿': '#4CAF50',
                    '紫': '#9C27B0',
                    '橙': '#FF9800',
                    '黑': '#212121',
                    '白': '#FFFFFF'
                }
            };
            
            let gameState = {
                score: 0,
                highScore: localStorage.getItem('colorChallengeHighScore') || 0,
                currentStreak: 0,
                maxStreak: 0,
                gameRunning: false,
                currentTime: gameConfig.baseTime,
                timer: null,
                timeInterval: null, // 用于计时器间隔
                currentQuestion: null,
                currentOptions: [],
                startTime: 0,
                remainingTime: gameConfig.baseTime // 添加剩余时间记录
            };
            
            const elements = {
                scoreValue: document.querySelector('.score-value'),
                highScoreValue: document.querySelector('.high-score-value'),
                streakValue: document.querySelector('.streak-value'),
                question: document.querySelector('.question'),
                optionsContainer: document.querySelector('.options'),
                timerBar: document.getElementById('timer-bar'),
                startScreen: document.getElementById('start-screen'),
                gameOverScreen: document.getElementById('game-over-screen'),
                finalScore: document.querySelector('.final-score'),
                maxStreak: document.querySelector('.max-streak'),
                startButton: document.getElementById('start-button'),
                restartButton: document.getElementById('restart-button'),
                scoreSubmit: document.getElementById('score-submit'),
                playerName: document.getElementById('player-name'),
                submitScore: document.getElementById('submit-score')
            };
            
            elements.highScoreValue.textContent = gameState.highScore;
            
            function generateQuestion() {
                const colorNames = Object.keys(gameConfig.colors);
                const questionType = Math.floor(Math.random() * 2);
                const target = colorNames[Math.floor(Math.random() * colorNames.length)];
                
                let questionText;
                if (questionType === 0) {
                    questionText = `下列哪个字是 <span style="color: ${gameConfig.colors[target]}; font-weight: bold">${target}</span> 色的？`;
                } else {
                    questionText = `下列哪个字是 " <span style="font-weight: bold">${target}</span> "？`;
                }
                
                const options = [];
                const usedCombinations = new Set();
                
                let correctOption;
                if (questionType === 0) {
                    let correctText;
                    do {
                        correctText = colorNames[Math.floor(Math.random() * colorNames.length)];
                    } while (correctText === target);
                    
                    correctOption = { text: correctText, color: target, isCorrect: true };
                } else {
                    let correctColor;
                    do {
                        correctColor = colorNames[Math.floor(Math.random() * colorNames.length)];
                    } while (correctColor === target);
                    
                    correctOption = { text: target, color: correctColor, isCorrect: true };
                }
                options.push(correctOption);
                usedCombinations.add(`${correctOption.text}-${correctOption.color}`);
                
                if (questionType === 0) {
                    let misleadingColor;
                    do {
                        misleadingColor = colorNames[Math.floor(Math.random() * colorNames.length)];
                    } while (misleadingColor === target);
                    
                    const misleadingOption = { text: target, color: misleadingColor, isCorrect: false };
                    options.push(misleadingOption);
                    usedCombinations.add(`${misleadingOption.text}-${misleadingOption.color}`);
                } else {
                    let misleadingText;
                    do {
                        misleadingText = colorNames[Math.floor(Math.random() * colorNames.length)];
                    } while (misleadingText === target);
                    
                    const misleadingOption = { text: misleadingText, color: target, isCorrect: false };
                    options.push(misleadingOption);
                    usedCombinations.add(`${misleadingOption.text}-${misleadingOption.color}`);
                }
                
                while (options.length < gameConfig.optionsCount) {
                    const text = colorNames[Math.floor(Math.random() * colorNames.length)];
                    let color;
                    do {
                        color = colorNames[Math.floor(Math.random() * colorNames.length)];
                    } while (color === text);
                    
                    const isPotentiallyCorrect = 
                        (questionType === 0 && color === target) || 
                        (questionType === 1 && text === target);
                    
                    const combination = `${text}-${color}`;
                    if (!usedCombinations.has(combination) && !isPotentiallyCorrect) {
                        usedCombinations.add(combination);
                        options.push({ text: text, color: color, isCorrect: false });
                    }
                }
                
                shuffleArray(options);
                return { text: questionText, type: questionType, target: target, options: options, correctOption: correctOption };
            }
            
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
            
            function displayQuestion(question) {
                elements.question.innerHTML = question.text;
                elements.optionsContainer.innerHTML = '';
                
                question.options.forEach(option => {
                    const optionElement = document.createElement('div');
                    optionElement.className = 'option option-hover bg-light rounded-lg p-5 text-center cursor-pointer relative min-h-[120px] flex items-center justify-center';
                    optionElement.style.color = gameConfig.colors[option.color];
                    optionElement.style.fontSize = '1.5rem';
                    optionElement.style.fontWeight = 'bold';
                    optionElement.textContent = option.text;
                    optionElement.dataset.correct = option.isCorrect;
                    
                    optionElement.addEventListener('click', () => {
                        if (gameState.gameRunning) {
                            handleOptionSelection(optionElement, option.isCorrect);
                        }
                    });
                    
                    elements.optionsContainer.appendChild(optionElement);
                });
                
                resetTimer();
            }
            
            function handleOptionSelection(element, isCorrect) {
                clearTimer();
                
                document.querySelectorAll('.option').forEach(opt => {
                    opt.style.pointerEvents = 'none';
                    
                    if (opt.dataset.correct === 'true') {
                        opt.style.backgroundColor = '#4CAF50';
                    } 
                    else if (opt === element && !isCorrect) {
                        opt.style.backgroundColor = '#F44336';
                    }
                });
                
                element.classList.add('option-active');
                
                if (isCorrect) {
                    gameState.score += gameConfig.pointsPerQuestion;
                    gameState.currentStreak++;
                    gameState.maxStreak = Math.max(gameState.maxStreak, gameState.currentStreak);
                    updateScoreDisplay();
                    updateGameSpeed();
                    setTimeout(() => nextQuestion(), 800);
                } else {
                    setTimeout(() => gameOver(), 1200);
                }
            }
            
            function resetTimer() {
                clearTimer();
                gameState.remainingTime = gameState.currentTime;
                updateTimerBar();
                
                // 使用setInterval替代requestAnimationFrame
                gameState.timeInterval = setInterval(() => {
                    gameState.remainingTime -= 0.1;
                    
                    if (gameState.remainingTime <= 0) {
                        gameState.remainingTime = 0;
                        clearTimer();
                        gameOver();
                        return;
                    }
                    
                    updateTimerBar();
                }, 100); // 每0.1秒更新一次
            }
            
            function updateTimerBar() {
                const percentage = (gameState.remainingTime / gameState.currentTime) * 100;
                elements.timerBar.style.width = `${percentage}%`;
            }
            
            function clearTimer() {
                if (gameState.timeInterval) {
                    clearInterval(gameState.timeInterval);
                    gameState.timeInterval = null;
                }
            }
            
            function updateScoreDisplay() {
                elements.scoreValue.textContent = gameState.score;
                elements.streakValue.textContent = gameState.currentStreak;
                
                if (gameState.score > gameState.highScore) {
                    gameState.highScore = gameState.score;
                    elements.highScoreValue.textContent = gameState.highScore;
                    localStorage.setItem('colorChallengeHighScore', gameState.highScore);
                }
            }
            
            function updateGameSpeed() {
                const questionsAnswered = gameState.score / gameConfig.pointsPerQuestion;
                
                for (let i = 0; i < gameConfig.timeLevels.length; i++) {
                    if (questionsAnswered >= gameConfig.timeLevels[i]) {
                        gameState.currentTime = gameConfig.baseTime - gameConfig.timeReductions[i];
                    }
                }
            }
            
            function nextQuestion() {
                gameState.currentQuestion = generateQuestion();
                displayQuestion(gameState.currentQuestion);
            }
            
            function gameOver() {
                gameState.gameRunning = false;
                clearTimer();
                
                elements.finalScore.textContent = gameState.score;
                elements.maxStreak.textContent = gameState.maxStreak;
                elements.gameOverScreen.classList.remove('hidden');
                elements.scoreSubmit.classList.remove('hidden');
            }
            
            function startGame() {
                gameState.score = 0;
                gameState.currentStreak = 0;
                gameState.maxStreak = 0;
                gameState.gameRunning = true;
                gameState.currentTime = gameConfig.baseTime;
                gameState.remainingTime = gameState.currentTime;
                
                updateScoreDisplay();
                elements.startScreen.classList.add('hidden');
                elements.gameOverScreen.classList.add('hidden');
                
                nextQuestion();
            }
            
            function submitScore() {
                const playerName = elements.playerName.value || '匿名玩家';
                const leaderboard = JSON.parse(localStorage.getItem('color_leaderboard') || '[]');
                
                leaderboard.push({
                    player: playerName,
                    score: gameState.score,
                    maxStreak: gameState.maxStreak,
                    date: new Date().toISOString()
                });
                
                leaderboard.sort((a, b) => b.score - a.score);
                
                localStorage.setItem('color_leaderboard', JSON.stringify(leaderboard));
                
                elements.scoreSubmit.classList.add('hidden');
            }
            
            elements.startButton.addEventListener('click', startGame);
            elements.restartButton.addEventListener('click', startGame);
            elements.submitScore.addEventListener('click', submitScore);
            
            elements.playerName.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    submitScore();
                }
            });
        });
    </script>
</body>
</html>
